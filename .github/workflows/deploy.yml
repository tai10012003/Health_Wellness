name: Deploy To EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  WEB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/health-wellness-web
  CMS_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/health-wellness-cms
  EC2_USER: ec2-user
  EC2_APP_DIR: /home/ec2-user/health-wellness

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Nuxt image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Strapi image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cms/Dockerfile
          push: true
          tags: |
            ${{ env.CMS_IMAGE }}:latest
            ${{ env.CMS_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            mkdir -p "${{ env.EC2_APP_DIR }}/deploy/nginx"

      - name: Verify deploy files
        run: |
          set -e
          test -f docker-compose.prod.yml
          test -f deploy/.env.production.example
          test -f deploy/nginx/default.conf.template
          test -f deploy/nginx/ssl.conf.template
          test -f deploy/issue-ssl.sh

      - name: Copy deploy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          target: ${{ env.EC2_APP_DIR }}
          source: docker-compose.prod.yml,deploy/.env.production.example,deploy/issue-ssl.sh,deploy/nginx/default.conf.template,deploy/nginx/ssl.conf.template

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd "${{ env.EC2_APP_DIR }}"
            test -f .env.production || (echo "Missing .env.production on EC2. Create ${{ env.EC2_APP_DIR }}/.env.production from deploy/.env.production.example first." && exit 1)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose --env-file .env.production -f docker-compose.prod.yml pull
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d
            docker image prune -f
